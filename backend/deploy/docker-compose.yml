services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}

      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    environment:
      REDIS_DB: ${REDIS_DB}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

  auth:
    build:
      { context: ..,
        dockerfile: services/auth/Dockerfile }
    env_file: ../services/auth/.env
    environment:
      POSTGRES_URL: postgresql+asyncpg://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@postgres:5432/${AUTH_DB_NAME}
      REDIS_URL: redis://${REDIS_USER}:${REDIS_PASSWORD}@redis:6379/0
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes:
      - ../keys:/keys:ro
    ports: [ "8001:8000" ]
    depends_on:
      postgres:
        { condition: service_healthy }

  catalog:
    build:
      { context: ..,
        dockerfile: services/catalog/Dockerfile }
    env_file: ../services/catalog/.env
    environment:
      POSTGRES_URL: postgresql+asyncpg://${CATALOG_DB_USER}:${CATALOG_DB_PASSWORD}@postgres:5432/${CATALOG_DB_NAME}
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes:
      - ../keys/public.pem:/keys/public.pem:ro
    ports: [ "8002:8000" ]
    depends_on:
      postgres:
        { condition: service_healthy }



volumes:
  pgdata:
  redis-data:
